<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Citizen &amp; GST All-in-One Calculator</title>
  <meta name="description" content="Complete professional All-in-One Calculator featuring Modern Circular Calculator with Scientific &amp; Unit Converter, GST Rates Calculator, Live Currency Converter, Calculation History, Age Calculator, and Banknote Cash Counter." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-mint: #F2FFF7;
      --navy: #10232B;
      --charcoal: #15191D;
      --lcd: #A6B991;
      --lcd-text: #101010;
      --btn-blue: #347BCB;
      --btn-blue-sec: #548DD7;
      --btn-clear: #D83B29;
      --btn-equal: #E3452E;
      --key-dark: #25252D;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #FAFBF9;
      color: #171717;
    }
    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }
    .key-3d {
      background-color: #25252D;
      color: #FFFFFF;
      box-shadow: 0 3px 0 #0a0c0e;
      transition: transform 0.06s ease, background-color 0.1s ease;
    }
    .key-3d:active { transform: translateY(2px); box-shadow: 0 1px 0 #0a0c0e; background-color: #32323d; }
    .key-blue {
      background-color: #347BCB;
      color: #FFFFFF;
      box-shadow: 0 2px 0 #1b4677;
    }
    .key-blue:active { transform: translateY(1.5px); box-shadow: 0 1px 0 #1b4677; }
    .key-blue-sec {
      background-color: #548DD7;
      color: #FFFFFF;
      box-shadow: 0 2px 0 #2b5791;
    }
    .key-blue-sec:active { transform: translateY(1.5px); }
    .key-red {
      background-color: #D83B29;
      color: #FFFFFF;
      box-shadow: 0 2px 0 #801e13;
    }
    .key-red:active { transform: translateY(1.5px); }
    .key-equal {
      background-color: #E3452E;
      color: #FFFFFF;
      box-shadow: 0 3px 0 #821f11;
    }
    .key-equal:active { transform: translateY(2px); }
    .lcd-panel {
      background-color: #A6B991;
      color: #101010;
      border: 2px solid #8d9f78;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);
    }
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    .cursor-bar {
      animation: blinkCursor 1.1s infinite;
    }
  </style>
</head>
<body class="h-[100dvh] w-full overflow-hidden flex flex-col bg-[#FAFBF9]">
  <div id="app-root" class="h-[100dvh] w-full overflow-hidden flex flex-col"></div>

  <script>
    (function () {
      const POPULAR_CURRENCIES = [
        { code: 'USD', name: 'U.S. Dollar', symbol: '$', country: 'United States', flag: '🇺🇸' },
        { code: 'INR', name: 'Indian Rupee', symbol: '₹', country: 'India', flag: '🇮🇳' },
        { code: 'EUR', name: 'Euro', symbol: '€', country: 'European Union', flag: '🇪🇺' },
        { code: 'GBP', name: 'British Pound', symbol: '£', country: 'United Kingdom', flag: '🇬🇧' },
        { code: 'AED', name: 'UAE Dirham', symbol: 'د.إ', country: 'United Arab Emirates', flag: '🇦🇪' },
        { code: 'SAR', name: 'Saudi Riyal', symbol: '﷼', country: 'Saudi Arabia', flag: '🇸🇦' },
        { code: 'BDT', name: 'Bangladeshi Taka', symbol: '৳', country: 'Bangladesh', flag: '🇧🇩' },
        { code: 'PKR', name: 'Pakistani Rupee', symbol: '₨', country: 'Pakistan', flag: '🇵🇰' },
        { code: 'CAD', name: 'Canadian Dollar', symbol: 'C$', country: 'Canada', flag: '🇨🇦' },
        { code: 'AUD', name: 'Australian Dollar', symbol: 'A$', country: 'Australia', flag: '🇦🇺' },
        { code: 'JPY', name: 'Japanese Yen', symbol: '¥', country: 'Japan', flag: '🇯🇵' },
        { code: 'CHF', name: 'Swiss Franc', symbol: 'CHF', country: 'Switzerland', flag: '🇨🇭' },
        { code: 'KRW', name: 'Korean Won', symbol: '₩', country: 'South Korea', flag: '🇰🇷' },
        { code: 'KWD', name: 'Kuwaiti Dinar', symbol: 'د.ك', country: 'Kuwait', flag: '🇰🇼' }
      ];

      const UNIT_CATEGORIES = {
        LENGTH: {
          label: 'Length',
          units: [
            { code: 'm', name: 'Meters (m)', factor: 1 },
            { code: 'km', name: 'Kilometers (km)', factor: 1000 },
            { code: 'cm', name: 'Centimeters (cm)', factor: 0.01 },
            { code: 'mm', name: 'Millimeters (mm)', factor: 0.001 },
            { code: 'in', name: 'Inches (in)', factor: 0.0254 },
            { code: 'ft', name: 'Feet (ft)', factor: 0.3048 },
            { code: 'mi', name: 'Miles (mi)', factor: 1609.344 }
          ]
        },
        WEIGHT: {
          label: 'Weight',
          units: [
            { code: 'kg', name: 'Kilograms (kg)', factor: 1 },
            { code: 'g', name: 'Grams (g)', factor: 0.001 },
            { code: 'lb', name: 'Pounds (lb)', factor: 0.45359237 },
            { code: 'oz', name: 'Ounces (oz)', factor: 0.02834952 }
          ]
        },
        TEMP: {
          label: 'Temp',
          units: [
            { code: 'C', name: 'Celsius (°C)', factor: 1 },
            { code: 'F', name: 'Fahrenheit (°F)', factor: 1 },
            { code: 'K', name: 'Kelvin (K)', factor: 1 }
          ]
        },
        AREA: {
          label: 'Area',
          units: [
            { code: 'sqm', name: 'Sq. Meter (m²)', factor: 1 },
            { code: 'sqft', name: 'Sq. Feet (ft²)', factor: 0.092903 },
            { code: 'acre', name: 'Acres', factor: 4046.856 },
            { code: 'hectare', name: 'Hectares', factor: 10000 }
          ]
        },
        DATA: {
          label: 'Data',
          units: [
            { code: 'MB', name: 'Megabytes (MB)', factor: 1 },
            { code: 'GB', name: 'Gigabytes (GB)', factor: 1024 },
            { code: 'TB', name: 'Terabytes (TB)', factor: 1048576 },
            { code: 'KB', name: 'Kilobytes (KB)', factor: 1 / 1024 }
          ]
        }
      };

      const INDIAN_DENOMINATIONS = [500, 200, 100, 50, 20, 10, 5, 2, 1];
      const HISTORY_KEY = 'all_in_one_calc_history_v1';
      const SETTINGS_KEY = 'all_in_one_calc_settings_v1';

      const state = {
        screen: 'citizen',
        prevScreen: 'citizen',
        drawerOpen: false,
        // Modern Circular Citizen Calculator State (starts completely empty)
        citExpr: '',
        citToolPanel: 'NONE', // 'NONE' | 'HISTORY' | 'RULER' | 'SCIENTIFIC'
        citRadMode: false,
        unitCategory: 'LENGTH',
        unitInput: '1',
        unitFrom: 'm',
        unitTo: 'ft',
        // GST & Other Calculators State
        settings: {
          numberFormat: 'INDIA',
          currencySymbol: '₹',
          gstRates: [5, 10, 15, 20, 25],
          soundEnabled: true,
          decimalPlaces: 2
        },
        history: [],
        displayValue: '0',
        expression: '0',
        pendingOp: null,
        storedValue: null,
        waitingForOperand: false,
        memoryValue: 0,
        grandTotal: 0,
        stepsList: [],
        gstResult: null,
        fxFrom: 'USD',
        fxTo: 'INR',
        fxAmount: '100',
        fxRates: { USD: 1, INR: 86.45, EUR: 0.95, GBP: 0.79, AED: 3.6725, SAR: 3.75, BDT: 121.5, PKR: 278.8, CAD: 1.42, AUD: 1.57, JPY: 151.8, CHF: 0.90, KRW: 1442.0, KWD: 0.308 },
        fxLastUpdated: 'Live Exchange Rate Feed',
        fxLoading: false,
        dobDay: '15',
        dobMonth: '08',
        dobYear: '1998',
        cashFormat: 'INDIA',
        cashQty: { 500: '', 200: '', 100: '', 50: '', 20: '', 10: '', 5: '', 2: '', 1: '' },
        toast: null
      };

      window.appState = state;

      try {
        const savedH = localStorage.getItem(HISTORY_KEY);
        if (savedH) state.history = JSON.parse(savedH);
        const savedS = localStorage.getItem(SETTINGS_KEY);
        if (savedS) state.settings = Object.assign({}, state.settings, JSON.parse(savedS));
      } catch (e) {}

      function persist() {
        try {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(state.history));
          localStorage.setItem(SETTINGS_KEY, JSON.stringify(state.settings));
        } catch (e) {}
      }

      function showToast(msg) {
        state.toast = msg;
        render();
        setTimeout(() => { state.toast = null; render(); }, 2000);
      }

      function formatNum(val, fmt, maxDec) {
        const n = Number(val);
        if (!Number.isFinite(n)) return '0';
        const locale = (fmt || state.settings.numberFormat) === 'INDIA' ? 'en-IN' : 'en-US';
        const dec = maxDec !== undefined ? maxDec : state.settings.decimalPlaces;
        return new Intl.NumberFormat(locale, { minimumFractionDigits: 0, maximumFractionDigits: dec }).format(n);
      }

      // Safe evaluation for the modern circular calculator
      function evaluateCalcExpression(rawExpr, radMode) {
        if (!rawExpr || !rawExpr.trim() || /^[0-9.]+$/.test(rawExpr.trim())) return '';
        let cleaned = rawExpr.replace(/[÷×−+^(\.]$/, '');
        if (!cleaned) return '';
        const openCount = (cleaned.match(/\(/g) || []).length;
        const closeCount = (cleaned.match(/\)/g) || []).length;
        if (openCount > closeCount) {
          cleaned += ')'.repeat(openCount - closeCount);
        }
        try {
          const degFactor = radMode ? '1' : '(Math.PI/180)';
          const jsExpr = cleaned
            .replace(/÷/g, '/')
            .replace(/×/g, '*')
            .replace(/−/g, '-')
            .replace(/π/g, '(Math.PI)')
            .replace(/e/g, '(Math.E)')
            .replace(/√\(/g, 'Math.sqrt(')
            .replace(/sin\(/g, 'Math.sin(' + degFactor + '*')
            .replace(/cos\(/g, 'Math.cos(' + degFactor + '*')
            .replace(/tan\(/g, 'Math.tan(' + degFactor + '*')
            .replace(/ln\(/g, 'Math.log(')
            .replace(/log\(/g, 'Math.log10(')
            .replace(/\^/g, '**')
            .replace(/(\d+(?:\.\d+)?)%/g, '($1/100)');

          if (!/^[0-9+\-*/().\sMathPIEsqrtincoalg,_*]+$/.test(jsExpr)) {
            return '';
          }
          const fn = new Function('return (' + jsExpr + ')');
          const res = fn();
          if (typeof res !== 'number' || !Number.isFinite(res)) return '';
          if (Number.isInteger(res)) return String(res);
          return parseFloat(res.toFixed(10)).toString();
        } catch (e) {
          return '';
        }
      }

      function renderColoredExpression(expr) {
        if (!expr) return '';
        const tokens = expr.split(/([÷×−+%()])/g).filter(Boolean);
        return tokens.map(part => {
          const isOpOrParen = /^[÷×−+%()]$/.test(part);
          return `<span class="${isOpOrParen ? 'text-[#3A8918] font-normal px-[1px]' : 'text-[#333333]'}">${part}</span>`;
        }).join('');
      }

      const ONES = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
      const TENS = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
      function twoDigits(n) {
        if (n === 0) return '';
        if (n < 20) return ONES[n];
        return TENS[Math.floor(n / 10)] + (n % 10 ? ' ' + ONES[n % 10] : '');
      }
      function threeDigits(n) {
        if (n === 0) return '';
        const h = Math.floor(n / 100);
        const r = n % 100;
        const hp = h > 0 ? ONES[h] + ' Hundred' : '';
        const rp = twoDigits(r);
        return hp && rp ? hp + ' ' + rp : (hp || rp);
      }
      function toIndianWords(amount) {
        const abs = Math.floor(Math.abs(Number(amount) || 0));
        if (abs === 0) return 'Zero Rupees Only';
        const parts = [];
        let rem = abs;
        const crore = Math.floor(rem / 10000000); rem %= 10000000;
        if (crore > 0) parts.push(threeDigits(crore) + ' Crore');
        const lakh = Math.floor(rem / 100000); rem %= 100000;
        if (lakh > 0) parts.push(twoDigits(lakh) + ' Lakh');
        const thousand = Math.floor(rem / 1000); rem %= 1000;
        if (thousand > 0) parts.push(twoDigits(thousand) + ' Thousand');
        if (rem > 0) parts.push(threeDigits(rem));
        return parts.join(' ') + ' Rupees Only';
      }
      function toWesternWords(amount) {
        const abs = Math.floor(Math.abs(Number(amount) || 0));
        if (abs === 0) return 'Zero Only';
        const scales = ['', 'Thousand', 'Million', 'Billion'];
        const parts = [];
        let rem = abs, idx = 0;
        while (rem > 0 && idx < scales.length) {
          const chunk = rem % 1000;
          if (chunk > 0) parts.unshift(threeDigits(chunk) + (scales[idx] ? ' ' + scales[idx] : ''));
          rem = Math.floor(rem / 1000);
          idx++;
        }
        return parts.join(' ') + ' Only';
      }

      function fetchLiveFx(base) {
        state.fxLoading = true;
        render();
        fetch('https://open.er-api.com/v6/latest/' + encodeURIComponent(base))
          .then(r => r.json())
          .then(data => {
            if (data && data.rates) {
              state.fxRates = data.rates;
              state.fxLastUpdated = data.time_last_update_utc ? new Date(data.time_last_update_utc).toLocaleString() : new Date().toLocaleString();
            }
          })
          .catch(() => {})
          .finally(() => {
            state.fxLoading = false;
            render();
          });
      }

      fetchLiveFx(state.fxFrom);

      function addHistory(rec) {
        state.history.unshift(Object.assign({
          id: 'calc-' + Date.now(),
          timestamp: new Date().toISOString()
        }, rec));
        persist();
      }

      window.appAct = {
        nav: function (scr) {
          if (scr !== state.screen) {
            state.prevScreen = state.screen;
            state.screen = scr;
          }
          state.drawerOpen = false;
          if (scr === 'currency') fetchLiveFx(state.fxFrom);
          render();
        },
        closeHistory: function () {
          const target = (state.prevScreen && state.prevScreen !== 'history') ? state.prevScreen : 'citizen';
          state.screen = target;
          state.drawerOpen = false;
          render();
        },
        toggleDrawer: function (open) {
          state.drawerOpen = open !== undefined ? open : !state.drawerOpen;
          render();
        },
        // Modern Circular Citizen Calculator Handlers
        citDigit: function (d) {
          state.citExpr = state.citExpr === '0' ? d : (state.citExpr.length >= 28 ? state.citExpr : state.citExpr + d);
          render();
        },
        citOp: function (op) {
          if (!state.citExpr) {
            if (op === '−') state.citExpr = '−';
            render();
            return;
          }
          if (/[÷×−+]$/.test(state.citExpr)) {
            state.citExpr = state.citExpr.slice(0, -1) + op;
          } else {
            state.citExpr += op;
          }
          render();
        },
        citPercent: function () {
          if (!state.citExpr || /[÷×−+(]$/.test(state.citExpr)) return;
          state.citExpr += '%';
          render();
        },
        citBrackets: function () {
          const openCount = (state.citExpr.match(/\(/g) || []).length;
          const closeCount = (state.citExpr.match(/\)/g) || []).length;
          const lastChar = state.citExpr.slice(-1);
          if (!state.citExpr || /[÷×−+(]$/.test(lastChar)) {
            state.citExpr += '(';
          } else if (openCount > closeCount && /[0-9)%πe]$/.test(lastChar)) {
            state.citExpr += ')';
          } else {
            state.citExpr += '×(';
          }
          render();
        },
        citDecimal: function () {
          const parts = state.citExpr.split(/[÷×−+()]/);
          const currentNum = parts[parts.length - 1] || '';
          if (currentNum.includes('.')) return;
          state.citExpr = (!state.citExpr || /[÷×−+(]$/.test(state.citExpr)) ? state.citExpr + '0.' : state.citExpr + '.';
          render();
        },
        citPlusMinus: function () {
          if (!state.citExpr) {
            state.citExpr = '(−';
            render();
            return;
          }
          if (state.citExpr.startsWith('(−') && state.citExpr.endsWith(')')) {
            state.citExpr = state.citExpr.slice(2, -1);
            render();
            return;
          }
          const match = state.citExpr.match(/(\d+(?:\.\d+)?)$/);
          if (match) {
            const num = match[1];
            const prefix = state.citExpr.slice(0, state.citExpr.length - num.length);
            if (prefix.endsWith('(−')) {
              state.citExpr = prefix.slice(0, -2) + num;
            } else {
              state.citExpr = prefix + '(−' + num;
            }
            render();
          }
        },
        citBackspace: function () {
          state.citExpr = state.citExpr.slice(0, -1);
          render();
        },
        citClear: function () {
          state.citExpr = '';
          render();
        },
        citEquals: function () {
          const preview = evaluateCalcExpression(state.citExpr, state.citRadMode);
          if (!preview) return;
          const numResult = parseFloat(preview);
          if (Number.isFinite(numResult)) {
            const firstMatch = state.citExpr.match(/\d+(?:\.\d+)?/);
            const firstNum = firstMatch ? parseFloat(firstMatch[0]) : numResult;
            addHistory({
              type: 'CITIZEN',
              expression: state.citExpr,
              originalAmount: firstNum,
              finalAmount: numResult
            });
            state.citExpr = preview;
            render();
          }
        },
        citSci: function (token) {
          if (token === 'x²') state.citExpr += '^2';
          else if (token === 'xʸ') state.citExpr += '^';
          else if (token === 'π' || token === 'e') {
            const needsMult = state.citExpr && /[0-9)%πe]$/.test(state.citExpr);
            state.citExpr += (needsMult ? '×' + token : token);
          } else {
            const needsMult = state.citExpr && /[0-9)%πe]$/.test(state.citExpr);
            state.citExpr += (needsMult ? '×' + token + '(' : token + '(');
          }
          render();
        },
        citTogglePanel: function (panel) {
          state.citToolPanel = state.citToolPanel === panel ? 'NONE' : panel;
          render();
        },
        // GST & Other Screen Handlers
        digit: function (d) {
          state.gstResult = null;
          if (state.waitingForOperand) {
            state.displayValue = d === '00' ? '0' : d;
            state.expression = state.pendingOp ? (state.storedValue + ' ' + state.pendingOp + ' ' + state.displayValue) : state.displayValue;
            state.waitingForOperand = false;
          } else {
            if (state.displayValue === '0') {
              if (d === '0' || d === '00') return;
              state.displayValue = d;
            } else if (state.displayValue.length < 14) {
              state.displayValue += d;
            }
            state.expression = state.pendingOp ? (state.storedValue + ' ' + state.pendingOp + ' ' + state.displayValue) : state.displayValue;
          }
          render();
        },
        decimal: function () {
          state.gstResult = null;
          if (state.waitingForOperand) {
            state.displayValue = '0.';
            state.waitingForOperand = false;
          } else if (!state.displayValue.includes('.')) {
            state.displayValue += '.';
          }
          render();
        },
        op: function (nextOp) {
          state.gstResult = null;
          const cur = parseFloat(state.displayValue) || 0;
          if (state.storedValue === null) {
            state.storedValue = cur;
          } else if (state.pendingOp && !state.waitingForOperand) {
            state.storedValue = computeOp(state.storedValue, cur, state.pendingOp);
            state.displayValue = String(state.storedValue);
          }
          state.pendingOp = nextOp;
          state.waitingForOperand = true;
          state.expression = state.storedValue + ' ' + nextOp;
          render();
        },
        equals: function () {
          const cur = parseFloat(state.displayValue) || 0;
          if (state.pendingOp && state.storedValue !== null) {
            const res = Number(computeOp(state.storedValue, cur, state.pendingOp).toFixed(state.settings.decimalPlaces));
            const expr = state.storedValue + ' ' + state.pendingOp + ' ' + cur;
            state.displayValue = String(res);
            state.expression = expr + ' = ' + res;
            state.grandTotal = Number((state.grandTotal + res).toFixed(2));
            state.stepsList.unshift(expr + ' = ' + formatNum(res));
            addHistory({ type: 'CITIZEN', expression: expr, originalAmount: state.storedValue, finalAmount: res });
            state.storedValue = null;
            state.pendingOp = null;
            state.waitingForOperand = true;
            render();
          }
        },
        percent: function () {
          const cur = parseFloat(state.displayValue) || 0;
          if (state.storedValue !== null && state.pendingOp) {
            const pct = (state.storedValue * cur) / 100;
            const res = state.pendingOp === '+' ? state.storedValue + pct : state.pendingOp === '−' ? state.storedValue - pct : pct;
            state.displayValue = String(Number(res.toFixed(2)));
            state.storedValue = null;
            state.pendingOp = null;
            state.waitingForOperand = true;
          } else {
            state.displayValue = String(cur / 100);
            state.waitingForOperand = true;
          }
          render();
        },
        sqrt: function () {
          const cur = parseFloat(state.displayValue) || 0;
          if (cur >= 0) {
            const res = Number(Math.sqrt(cur).toFixed(state.settings.decimalPlaces));
            state.displayValue = String(res);
            state.expression = '√(' + cur + ') = ' + res;
            state.waitingForOperand = true;
            render();
          }
        },
        gst: function (rate) {
          const base = (state.gstResult && state.waitingForOperand) ? state.gstResult.originalAmount : (parseFloat(state.displayValue) || 0);
          if (base <= 0) return;
          const abs = Math.abs(rate);
          let orig = base, gstAmt = 0, finalAmt = 0;
          if (rate > 0) {
            gstAmt = (base * abs) / 100;
            finalAmt = base + gstAmt;
          } else {
            orig = base / (1 + abs / 100);
            gstAmt = base - orig;
            finalAmt = base;
          }
          const cleanOrig = Number(orig.toFixed(2));
          const cleanGst = Number(gstAmt.toFixed(2));
          const cleanHalf = Number((gstAmt / 2).toFixed(2));
          const cleanFinal = Number(finalAmt.toFixed(2));
          state.gstResult = {
            originalAmount: cleanOrig,
            gstRate: rate,
            gstAmount: cleanGst,
            cgstAmount: cleanHalf,
            sgstAmount: cleanHalf,
            igstAmount: cleanGst,
            finalAmount: cleanFinal
          };
          state.displayValue = String(rate > 0 ? cleanFinal : cleanOrig);
          state.expression = base + ' ' + (rate > 0 ? '+' + abs : '-' + abs) + '% GST';
          state.waitingForOperand = true;
          state.stepsList.unshift(formatNum(base) + ' (' + (rate > 0 ? '+' : '-') + abs + '% GST) → ' + formatNum(rate > 0 ? cleanFinal : cleanOrig));
          addHistory({
            type: 'GST',
            expression: state.expression,
            originalAmount: cleanOrig,
            gstRate: rate,
            gstAmount: cleanGst,
            cgstAmount: cleanHalf,
            sgstAmount: cleanHalf,
            igstAmount: cleanGst,
            finalAmount: cleanFinal
          });
          render();
        },
        del: function () {
          if (state.gstResult) {
            state.displayValue = String(state.gstResult.originalAmount);
            state.gstResult = null;
            state.waitingForOperand = false;
            render();
            return;
          }
          if (!state.waitingForOperand) {
            state.displayValue = state.displayValue.length > 1 ? state.displayValue.slice(0, -1) : '0';
            state.expression = state.displayValue;
            render();
          }
        },
        clear: function () {
          state.displayValue = '0';
          state.expression = '0';
          state.pendingOp = null;
          state.storedValue = null;
          state.waitingForOperand = false;
          state.gstResult = null;
          render();
        },
        mem: function (action) {
          const cur = parseFloat(state.displayValue) || 0;
          if (action === 'M+') state.memoryValue += cur;
          else if (action === 'M-') state.memoryValue -= cur;
          else if (action === 'MR') { state.displayValue = String(state.memoryValue); state.expression = 'MR = ' + state.memoryValue; }
          else if (action === 'GT') { state.displayValue = String(state.grandTotal); state.expression = 'GT = ' + state.grandTotal; }
          else if (action === 'MC') { state.memoryValue = 0; state.grandTotal = 0; }
          state.waitingForOperand = true;
          render();
        },
        setGstPreset: function (rates) {
          state.settings.gstRates = rates;
          persist();
          render();
        },
        swapFx: function () {
          const tmp = state.fxFrom;
          state.fxFrom = state.fxTo;
          state.fxTo = tmp;
          fetchLiveFx(state.fxFrom);
        },
        saveCashHistory: function (notesCount, grandTotal, words) {
          if (grandTotal <= 0) return showToast('Enter note quantities first');
          addHistory({
            type: 'CASH',
            expression: notesCount + ' Notes Cash Count',
            originalAmount: notesCount,
            finalAmount: grandTotal,
            note: words
          });
          showToast('Saved to Calculation History');
        },
        shareText: function (txt) {
          if (navigator.share) {
            navigator.share({ title: 'Calculator Result', text: txt }).catch(() => {});
          } else if (navigator.clipboard) {
            navigator.clipboard.writeText(txt);
            showToast('Copied to clipboard');
          }
        },
        deleteHistory: function (id) {
          state.history = state.history.filter(h => h.id !== id);
          persist();
          render();
        },
        clearHistory: function () {
          state.history = [];
          persist();
          render();
        }
      };

      function computeOp(a, b, op) {
        if (op === '+') return a + b;
        if (op === '−') return a - b;
        if (op === '×') return a * b;
        if (op === '÷') return b === 0 ? 0 : a / b;
        if (op === 'MU') return b === 100 ? 0 : a / (1 - b / 100);
        return b;
      }

      function computeUnitValue() {
        const val = parseFloat(state.unitInput);
        if (!Number.isFinite(val)) return '0';
        if (state.unitCategory === 'TEMP') {
          let celsius = val;
          if (state.unitFrom === 'F') celsius = ((val - 32) * 5) / 9;
          if (state.unitFrom === 'K') celsius = val - 273.15;
          let out = celsius;
          if (state.unitTo === 'F') out = (celsius * 9) / 5 + 32;
          if (state.unitTo === 'K') out = celsius + 273.15;
          return parseFloat(out.toFixed(4)).toString();
        }
        const list = UNIT_CATEGORIES[state.unitCategory].units;
        const fromObj = list.find(u => u.code === state.unitFrom) || list[0];
        const toObj = list.find(u => u.code === state.unitTo) || list[1] || list[0];
        const baseVal = val * fromObj.factor;
        const result = baseVal / toObj.factor;
        return parseFloat(result.toFixed(6)).toString();
      }

      // Full-screen Age Calculator
      function renderAgeScreen() {
        const d = parseInt(state.dobDay, 10) || 15;
        const m = parseInt(state.dobMonth, 10) || 8;
        const y = parseInt(state.dobYear, 10) || 1998;
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const dob = new Date(y, m - 1, d);
        let years = today.getFullYear() - dob.getFullYear();
        let months = today.getMonth() - dob.getMonth();
        let days = today.getDate() - dob.getDate();
        if (days < 0) {
          months -= 1;
          days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
        }
        if (months < 0) { years -= 1; months += 12; }
        let nextBday = new Date(today.getFullYear(), m - 1, d);
        if (nextBday < today) nextBday = new Date(today.getFullYear() + 1, m - 1, d);
        const diffDays = Math.max(0, Math.ceil((nextBday - today) / (1000 * 60 * 60 * 24)));
        const weekdays = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

        return `
          <div class="h-[100dvh] w-full overflow-y-auto bg-gradient-to-b from-[#E9FFF0] via-[#F2FFF7] to-[#B9EFCB] flex flex-col">

                  <div><label class="text-xs text-neutral-500">Day (DD)</label><input type="number" value="${state.dobDay}" oninput="window.appState.dobDay=this.value" class="w-full px-3 py-2.5 text-center rounded-xl bg-[#F7F2FA] border font-mono-num font-bold text-lg" /></div>
                  <div><label class="text-xs text-neutral-500">Month (MM)</label><input type="number" value="${state.dobMonth}" oninput="window.appState.dobMonth=this.value" class="w-full px-3 py-2.5 text-center rounded-xl bg-[#F7F2FA] border font-mono-num font-bold text-lg" /></div>
                  <div><label class="text-xs text-neutral-500">Year (YYYY)</label><input type="number" value="${state.dobYear}" oninput="window.appState.dobYear=this.value" class="w-full px-3 py-2.5 text-center rounded-xl bg-[#F7F2FA] border font-mono-num font-bold text-lg" /></div>
                </div>
                <button onclick="window.rerenderApp()" class="w-full py-3 rounded-xl bg-[#347BCB] text-white font-bold text-sm">Calculate Age</button>
              </div>
              <div class="bg-white rounded-2xl p-5 shadow-xl border border-[#E9E9EC]">
                <h3 class="font-bold text-base text-[#10232B] mb-3">Age</h3>
                <div class="grid grid-cols-3 gap-3 text-center">
                  <div class="p-3.5 rounded-xl bg-[#F2FFF7] border border-[#C5F4D5]"><div class="font-mono-num font-extrabold text-3xl text-[#10232B]">${years}</div><div class="text-xs font-bold text-neutral-600 mt-1">Years</div></div>
                  <div class="p-3.5 rounded-xl bg-[#F2FFF7] border border-[#C5F4D5]"><div class="font-mono-num font-extrabold text-3xl text-[#347BCB]">${months}</div><div class="text-xs font-bold text-neutral-600 mt-1">Months</div></div>

                  <div class="p-3 rounded-xl bg-[#F7F2FA]"><div class="font-mono-num font-bold text-xl text-[#347BCB]">${diffDays} Days</div><div class="text-xs text-neutral-500">Remaining</div></div>
                  <div class="p-3 rounded-xl bg-[#F2FFF7]"><div class="font-mono-num font-bold text-sm text-[#10232B]">${nextBday.toLocaleDateString()}</div><div class="text-xs text-neutral-500">Date</div></div>
                  <div class="p-3 rounded-xl bg-[#F2FFF7]"><div class="font-bold text-sm text-[#10232B]">${weekdays[nextBday.getDay()]}</div><div class="text-xs text-neutral-500">Weekday</div></div>
                </div>
              </div>
            </main>
          </div>
        `;
      }

      // Full-screen Banknote Counter
      function renderBanknoteScreen() {
        let notesCount = 0, grandTotal = 0;
        INDIAN_DENOMINATIONS.forEach(d => {
          const q = parseInt(state.cashQty[d] || '0', 10) || 0;
          if (q > 0) { notesCount += q; grandTotal += d * q; }
        });
        const words = state.cashFormat === 'INDIA' ? toIndianWords(grandTotal) : toWesternWords(grandTotal);
        return `
          <div class="h-[100dvh] w-full overflow-y-auto bg-gradient-to-b from-[#E9FFF0] via-[#F2FFF7] to-[#B9EFCB] flex flex-col">
            <header class="sticky top-0 z-30 bg-[#10232B] text-white h-14 px-4 flex items-center justify-between shadow-md shrink-0">
              <div class="flex items-center gap-3">
                <button onclick="appAct.toggleDrawer(true)" class="w-10 h-10 rounded-lg hover:bg-white/10 flex items-center justify-center text-xl">☰</button>
                <h1 class="text-lg font-bold">Money Cash Counter</h1>
              </div>
              <button onclick="window.resetCash()" class="px-3 py-1.5 rounded-lg bg-white/10 text-xs font-bold">↻ Reset</button>
            </header>
            <main class="flex-1 w-full p-3 sm:p-5 space-y-4">
              <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-xl border border-[#E9E9EC] space-y-3">
                <div class="flex justify-between items-center border-b border-[#E9E9EC] pb-2.5">
                  <span class="text-xs font-bold text-[#10232B]">Display Format</span>
                  <div class="flex gap-1 bg-neutral-100 p-1 rounded-xl">
                    <button onclick="window.appState.cashFormat='INDIA';window.rerenderApp()" class="px-3 py-1 rounded-lg text-xs font-bold ${state.cashFormat==='INDIA'?'bg-[#347BCB] text-white':''}">India</button>
                    <button onclick="window.appState.cashFormat='WESTERN';window.rerenderApp()" class="px-3 py-1 rounded-lg text-xs font-bold ${state.cashFormat==='WESTERN'?'bg-[#347BCB] text-white':''}">Western</button>
                  </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-12 gap-3">
                  <div class="sm:col-span-4 p-3 rounded-xl bg-[#F7F2FA] border border-[#E9E9EC]">
                    <div class="text-xs font-bold text-neutral-500">Notes Total</div>
                    <div id="cash-notes-total" class="font-mono-num font-extrabold text-2xl text-[#10232B]">${formatNum(notesCount, state.cashFormat, 0)} Pcs</div>
                  </div>
                  <div class="sm:col-span-8 p-3 rounded-xl lcd-panel">
                    <div class="text-xs font-mono-num font-bold opacity-75">Grand Total</div>
                    <div id="cash-grand-total" class="font-mono-num font-extrabold text-3xl">₹${formatNum(grandTotal, state.cashFormat, 0)}</div>
                  </div>
                </div>
                <div class="p-3 rounded-xl bg-[#F2FFF7] border border-[#C5F4D5]">
                  <div class="text-[11px] font-bold text-[#347BCB]">Amount in Words</div>
                  <div id="cash-words" class="text-sm font-bold text-[#10232B]">${words}</div>
                </div>
              </div>

              <div class="bg-white rounded-2xl shadow-lg border border-[#E9E9EC] overflow-hidden">
                <div class="grid grid-cols-12 bg-[#10232B] text-white px-4 py-3 text-xs font-bold">
                  <div class="col-span-4">Notes</div>
                  <div class="col-span-4 text-center">Pcs</div>
                  <div class="col-span-4 text-right">Total</div>
                </div>
                <div class="divide-y divide-[#E9E9EC]">
                  ${INDIAN_DENOMINATIONS.map(d => {
                    const q = parseInt(state.cashQty[d] || '0', 10) || 0;
                    return `
                      <div class="grid grid-cols-12 items-center px-4 py-2.5">
                        <div class="col-span-4"><span class="inline-block w-16 py-1 text-center rounded-lg bg-[#25252D] text-white font-mono-num font-bold text-sm">₹${d}</span> ×</div>
                        <div class="col-span-4 text-center">
                          <input type="number" min="0" value="${state.cashQty[d] || ''}" oninput="window.updateCashRow(${d}, this.value)" placeholder="0" class="w-24 px-2 py-1.5 text-center rounded-xl bg-[#F7F2FA] border font-mono-num font-bold" />
                        </div>
                        <div id="cash-row-${d}" class="col-span-4 text-right font-mono-num font-bold text-sm">= ₹${formatNum(d * q, state.cashFormat, 0)}</div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>

              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                <button onclick="window.resetCash()" class="py-3 rounded-xl key-red font-bold text-xs">Reset</button>
                <button onclick="appAct.shareText('Grand Total: ₹${formatNum(grandTotal, state.cashFormat, 0)} (' + '${words}' + ')')" class="py-3 rounded-xl key-blue font-bold text-xs">Share Result</button>
                <button onclick="appAct.shareText('₹${formatNum(grandTotal, state.cashFormat, 0)}')" class="py-3 rounded-xl key-blue-sec font-bold text-xs">Copy Total</button>
                <button onclick="appAct.saveCashHistory(${notesCount}, ${grandTotal}, '${words}')" class="py-3 rounded-xl bg-[#10232B] text-white font-bold text-xs">Save Calculation</button>
              </div>
            </main>
          </div>
        `;
      }

      // Full-screen Settings / About Screen
      function renderSettingsOrAbout() {
        return `
          <div class="h-[100dvh] w-full overflow-y-auto bg-gradient-to-b from-[#E9FFF0] via-[#F2FFF7] to-[#B9EFCB] flex flex-col">
            <header class="sticky top-0 z-30 bg-[#10232B] text-white h-14 px-4 flex items-center justify-between shadow-md shrink-0">
              <div class="flex items-center gap-3">
                <button onclick="appAct.toggleDrawer(true)" class="w-10 h-10 rounded-lg hover:bg-white/10 flex items-center justify-center text-xl">☰</button>
                <h1 class="text-lg font-bold">${state.screen === 'settings' ? 'Settings' : 'About Application'}</h1>
              </div>
            </header>
            <main class="flex-1 w-full p-4 space-y-4">
              <div class="bg-white rounded-2xl p-5 shadow-md border border-[#E9E9EC] space-y-3">
                <h2 class="font-bold text-base text-[#10232B]">All-in-One Citizen &amp; GST Calculator</h2>
                <p class="text-xs text-neutral-600">Includes Modern Circular Citizen Calculator with Scientific &amp; Unit Converter, GST Rates Calculator, Currency Converter, Calculation History, Age Calculator, and Banknote Cash Counter.</p>
                <div class="flex gap-2 pt-2">
                  <button onclick="window.appState.settings.numberFormat='INDIA';window.rerenderApp()" class="px-4 py-2 rounded-xl text-xs font-bold ${state.settings.numberFormat==='INDIA'?'bg-[#347BCB] text-white':'bg-neutral-100'}">India Format (Lakh/Crore)</button>
                  <button onclick="window.appState.settings.numberFormat='WESTERN';window.rerenderApp()" class="px-4 py-2 rounded-xl text-xs font-bold ${state.settings.numberFormat==='WESTERN'?'bg-[#347BCB] text-white':'bg-neutral-100'}">Western Format (Million)</button>
                </div>
              </div>
            </main>
          </div>
        `;
      }

      window.rerenderApp = render;
      window.setUnitCategory = function (cat) {
        state.unitCategory = cat;
        const list = UNIT_CATEGORIES[cat].units;
        state.unitFrom = list[0].code;
        state.unitTo = (list[1] || list[0]).code;
        render();
      };
      window.updateFxFrom = function (val) { state.fxFrom = val; fetchLiveFx(val); };
      window.updateFxTo = function (val) { state.fxTo = val; render(); };
      window.updateFxAmt = function (val) {
        state.fxAmount = val;
        const toMeta = POPULAR_CURRENCIES.find(c => c.code === state.fxTo) || POPULAR_CURRENCIES[1];
        const el = document.getElementById('fx-converted-val');
        if (el) el.textContent = toMeta.symbol + ' ' + formatNum((parseFloat(val) || 0) * (state.fxRates[state.fxTo] || 1));
      };
      window.resetCash = function () {
        INDIAN_DENOMINATIONS.forEach(d => state.cashQty[d] = '');
        render();
      };
      window.updateCashRow = function (denom, val) {
        state.cashQty[denom] = val.replace(/[^0-9]/g, '');
        let notesCount = 0, grandTotal = 0;
        INDIAN_DENOMINATIONS.forEach(d => {
          const q = parseInt(state.cashQty[d] || '0', 10) || 0;
          if (q > 0) { notesCount += q; grandTotal += d * q; }
          const rowEl = document.getElementById('cash-row-' + d);
          if (rowEl) rowEl.textContent = '= ₹' + formatNum(d * q, state.cashFormat, 0);
        });
        const nEl = document.getElementById('cash-notes-total');
        const gEl = document.getElementById('cash-grand-total');
        const wEl = document.getElementById('cash-words');
        if (nEl) nEl.textContent = formatNum(notesCount, state.cashFormat, 0) + ' Pcs';
        if (gEl) gEl.textContent = '₹' + formatNum(grandTotal, state.cashFormat, 0);
        if (wEl) wEl.textContent = state.cashFormat === 'INDIA' ? toIndianWords(grandTotal) : toWesternWords(grandTotal);
      };

      function render() {
        const root = document.getElementById('app-root');
        if (!root) return;
        let content = '';
        if (state.screen === 'citizen') content = renderCitizenScreen();
        else if (state.screen === 'gst') content = renderGstScreen();
        else if (state.screen === 'currency') content = renderCurrencyScreen();
        else if (state.screen === 'history') content = renderHistoryScreen();
        else if (state.screen === 'age') content = renderAgeScreen();
        else if (state.screen === 'banknote') content = renderBanknoteScreen();
        else content = renderSettingsOrAbout();

        root.innerHTML = renderDrawer() + content + (state.toast ? `<div class="fixed bottom-4 right-4 z-50 bg-[#10232B] text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-xl">${state.toast}</div>` : '');
      }

      render();
    })();
  </script>
</body>
</html>
